name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · Type-check · Tests
    runs-on: ubuntu-latest
    env:
      # Random-init encoder: avoids downloading ImageNet weights in CI.
      SAR__MODEL__ENCODER_WEIGHTS: "null"
      SAR__TRAINING__DEVICE: cpu
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gdal-bin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install -e .

      - name: Ruff (lint)
        run: ruff check .

      - name: mypy (static types)
        run: mypy --ignore-missing-imports src/ app/

      - name: Generate synthetic dataset for integration tests
        run: python scripts/generate_synthetic_data.py --n-scenes 3 --image-size 160

      - name: pytest
        run: pytest tests/ -v --cov=src --cov=app --cov-report=term-missing --cov-fail-under=70

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: sar-bushfire-api:ci
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: false
          tags: sar-bushfire-dashboard:ci
